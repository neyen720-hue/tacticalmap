<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>360 Tactical Trainer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

    <header class="topbar">

        <div class="logo">
            360
        </div>

        <div class="title">
            TACTICAL TRAINER
        </div>

        <div class="status">
            ● {{ usuario.nombre_completo }} — {{ usuario.rol | upper }}
        </div>

    </header>


    <main class="dashboard">

        <section class="welcome">

            <h1>360 Tactical Trainer</h1>

            <p>
                Bienvenido,
                <strong>{{ usuario.nombre_completo }}</strong>.
            </p>

        </section>


        <section class="modules">

            <button class="module">

                <span class="module-icon">👤</span>

                <span class="module-title">
                    USUARIOS
                </span>

                <span class="module-description">
                    Gestión de jugadores y miembros.
                </span>

            </button>


            <button class="module">

                <span class="module-icon">🗺️</span>

                <span class="module-title">
                    MAPA TÁCTICO
                </span>

                <span class="module-description">
                    Planificación y análisis del campo de batalla.
                </span>

            </button>


            <button class="module">

                <span class="module-icon">📋</span>

                <span class="module-title">
                    PLANIFICACIÓN
                </span>

                <span class="module-description">
                    Crear y organizar operaciones.
                </span>

            </button>


            <button class="module">

                <span class="module-icon">🤖</span>

                <span class="module-title">
                    IA TÁCTICA
                </span>

                <span class="module-description">
                    Asistencia para planificación y análisis.
                </span>

            </button>


           <a
    href="/mapa"
    class="module"
>

    <span class="module-icon">🗺️</span>

    <span class="module-title">
        MAPA TÁCTICO
    </span>

    <span class="module-description">
        Planificación y análisis del campo de batalla.
    </span>

</a>

        </section>

    </main>


    <footer>

        <span>
            360 Tactical Trainer
        </span>

        <span>
            Usuario: {{ usuario.nombre_usuario }}
        </span>

        <a href="/logout">
            CERRAR SESIÓN
        </a>

    </footer>


    <script src="{{ url_for('static', path='js/app.js') }}"></script>

</body>

</html>
